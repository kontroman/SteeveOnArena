<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MineArena</title>
  <style>
    @font-face{font-family:Mine;src:url('4197-font.ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#242e29;font-family:Mine,monospace}
    #unity-canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}
    #loadingScreen{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:radial-gradient(ellipse at top,#4f7166,#263b36 65%);color:#fff4d6;padding:24px;z-index:10}
    .panel{width:100%;max-width:440px;min-width:0;text-align:center;padding:28px 24px;background:#e8d5a9;border:4px solid #594b37;box-shadow:0 8px 0 #172c27,inset 0 0 0 4px #fff0cb;color:#514737}
    .art{width:clamp(110px,24vh,200px);aspect-ratio:1;object-fit:cover;border:4px solid #685537;box-shadow:4px 4px 0 #baa675}
    h1{font-size:clamp(27px,6vw,40px);margin:20px 0 12px;letter-spacing:2px;color:#2e696b;text-shadow:2px 2px #fff4d6}
    #status{min-height:2em;font-size:17px;line-height:1.4}
    .track{height:28px;padding:4px;background:#6b624e;border:3px solid #514737;box-shadow:0 3px #c0aa7c;margin:15px 0 12px}
    #progressFill{height:100%;width:0;background:repeating-linear-gradient(90deg,#6aa99c 0,#6aa99c 15px,#579084 15px,#579084 18px);box-shadow:inset 0 3px #9dc8af;transition:width .15s linear}
    #percent{font-size:18px}.hint{font-size:14px;line-height:1.5;color:#776444;margin-bottom:0}
    button{font:inherit;background:#d5a74e;border:3px solid #594b37;padding:12px 22px;color:#443b2d;cursor:pointer;margin-top:12px;box-shadow:0 4px #9c793f}
    @media(prefers-reduced-motion:reduce){#progressFill{transition:none}}@media(max-height:500px){.art{width:80px}.panel{padding:12px}h1{margin:8px} .hint{display:none}}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loadingScreen"><main class="panel">
    <img class="art" src="game-icon.png" alt="">
    <h1>MINEARENA</h1><div id="status" role="status">Готовим приключение…</div>
    <div class="track" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressFill"></div></div>
    <div id="percent">0%</div><p class="hint">Добывай ресурсы. Создавай броню. Побеждай.</p>
    <button id="retry" hidden>Повторить</button>
  </main></div>
  <script src="yandex-sdk.js"></script>
  <script>
    const statusText=document.getElementById('status');
    window.mineArenaLoadingError=()=>{statusText.textContent='Не удалось загрузить игру. Проверь соединение и попробуй ещё раз.';document.getElementById('retry').hidden=false;};
    document.getElementById('retry').onclick=()=>location.reload();
    document.getElementById('unity-canvas').addEventListener('contextmenu',e=>e.preventDefault());
    function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Script loading failed'));document.head.appendChild(s);});}
    (async()=>{
      try{
        if(!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) await loadScript('/sdk.js');
        await MineArenaPlatform.init();
        await loadScript('Build/{{{ LOADER_FILENAME }}}');
        const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},showBanner:(message,type)=>{if(type==='error')window.mineArenaLoadingError();}};
        const instance=await createUnityInstance(document.getElementById('unity-canvas'),config,p=>{
          const value=Math.min(99,Math.round(p*99));document.getElementById('progressFill').style.width=value+'%';document.getElementById('percent').textContent=value+'%';document.querySelector('.track').setAttribute('aria-valuenow',value);statusText.textContent=p<.9?'Загружаем мир…':'Загружаем прогресс…';
        });
        MineArenaPlatform.attach(instance);
      }catch(error){console.error('MineArena startup failed',error);window.mineArenaLoadingError();}
    })();
  </script>
</body>
</html>
